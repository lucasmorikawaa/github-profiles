<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container text-center">
      <main>
        <section>
          <div class="display-6">
            Busca Usuário Github
          </div>
          <form>
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <input type="text" class="form-control" id="inputUser" placeholder="User Github">
                </div>
            </div>
            <button class="btn btn-primary mt-4">Pesquisar</button>
          </form>
        </section>

        <section mt-5>
          <div class="display-6">
            Dados do usuário:
          </div>
          <div id="name">

          </div>
          <div id="url">

          </div>
          <div id="company">

          </div>
          <img src="" alt="" id="avatar_url" width="250" height="250" class="shadow rounded">
        </section>
        <section class="mt-5">
          <div class="display-6">
            Histórico:
          </div>
          <div class="row mt-3">
            <div class="col">
                <img src="" alt="" id="avatar_url" width="110" height="110" class="shadow rounded">
            </div>
          </div>
        </section>
      </main>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
